# pyproject.toml

[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sudoku_solver"
version = "1.0.0"
description = "Class representing Sudoku boards with associated solution method"
readme = "README.md"
authors = [{ name = "Christopher Holland", email = "chris.henry.holland@gmail.com" }]
license = { file = "LICENSE" }
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
]
keywords = ["sudoku", "python", "backtracking", "mathematics", "algorithm", "bitmask", "numpy"]
dependencies = [
    "sortedcontainers>=2.4.0",
    "numpy>=1.26.0",
    "pytest>=9.0.3",
]
requires-python = ">=3.11"

[project.urls]
Repository = "https://github.com/chris-henry-holland/python-SudokuSolver.git"